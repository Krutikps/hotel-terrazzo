{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="{% static 'css/staff.css' %}"></head>
<body><div class="login-wrap"><form class="login-card" method="post">{% csrf_token %}<h1>Reset your password</h1><p class="muted">Enter your staff email and we'll send you a reset link.</p>
{{ form.email.errors }}<div class="field"><label class="f">Email</label><input class="input" type="email" name="email" required autofocus></div>
<button class="btn primary" style="width:100%;justify-content:center">Send reset link</button><p class="small" style="text-align:center;margin-top:12px"><a href="{% url 'staff:login' %}">Back to sign in</a></p></form></div></body></html>
