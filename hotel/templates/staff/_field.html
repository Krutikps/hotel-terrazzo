<div class="field">{% if f.field.widget.input_type == 'checkbox' %}<label><input type="checkbox" class="chk" name="{{ f.html_name }}" {% if f.value %}checked{% endif %}> <b>{{ f.label }}</b></label>{% else %}<label class="f" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% endif %}{% if f.help_text %}<div class="help">{{ f.help_text }}</div>{% endif %}{{ f.errors }}</div>
