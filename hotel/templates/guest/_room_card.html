<article class="card room-card">
  {% if t.primary_image %}<a href="{% url 'guest:room' t.slug %}"><img class="hero-img" src="{{ t.primary_image.src }}" alt="{{ t.name }}" loading="lazy"></a>{% endif %}
  <div class="body"><h3><a href="{% url 'guest:room' t.slug %}" style="color:inherit;text-decoration:none">{{ t.name }}</a></h3><p class="muted" style="margin:0 0 6px">{{ t.short_description }}</p>
    <div class="tags"><span class="tag">{{ t.size_sqft }} sq ft</span><span class="tag">{{ t.bed_type }}</span><span class="tag">Up to {{ t.max_occupancy }} guests</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px"><div class="price"><small>from</small> {{ hotel.currency_symbol }}{{ t.from_price|floatformat:"0g" }}<small> / night</small></div><a class="btn sm" href="{% url 'guest:room' t.slug %}">View room</a></div></div>
</article>
